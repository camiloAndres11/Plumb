{% from "_macros.html" import csrf %}
{% if usuario %}
<div class="side-foot"><div class="kicker">Sesión</div><b>{{ (empresa or {}).get("nombre", "") }}</b>
<small>{{ usuario.get("email", "") }}</small>
<div style="display:flex;gap:12px;margin-top:10px;font-size:12px">
<a href="/cuenta" style="color:var(--ad-ink-70)">Cuenta</a>
<form method="post" action="/logout" style="display:inline">{{ csrf(csrf_token) }}
<button type="submit" style="background:none;border:0;color:var(--ad-ink-70);cursor:pointer;font:inherit;font-size:12px;padding:0">Salir →</button></form>
</div></div>
{% endif %}
