# Dev local: docker compose up  ->  API en :8000, plataforma en :8100, Postgres en :5432
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plomada
      POSTGRES_PASSWORD: plomada
      POSTGRES_DB: plomada
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plomada"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    environment:
      # Forma plana, no `postgresql+psycopg://`: la de SQLAlchemy no la
      # parsean ni psycopg ni el ATTACH de DuckDB, y aqui no se usa SQLAlchemy.
      DATABASE_URL: postgresql://plomada:plomada@db:5432/plomada
      SELF_URL: http://localhost:8000
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  # Plataforma Pliego (cuentas + enfoques sobre Croma). Ver plataforma/app.py.
  plataforma:
    build: { context: ., dockerfile: plataforma/Dockerfile }
    environment:
      DATABASE_URL: postgresql://plomada:plomada@db:5432/plomada
      BASE_URL: http://localhost:8100
      SECRET_KEY: ${SECRET_KEY:-solo-para-desarrollo-cambiar-en-produccion}
      SMTP_URL: ${SMTP_URL:-}
      PLATAFORMA_ADMINS: ${PLATAFORMA_ADMINS:-}
      PLIEGO_FUENTE: warehouse
      CROMA_API_KEY: ${CROMA_API_KEY:-}
      PLATAFORMA_DATOS: /app/data
    volumes: ["pliego_datos:/app/data"]
    ports: ["8100:8100"]
    depends_on:
      db: { condition: service_healthy }

  # Perfil aparte: no arranca con 'up', se invoca explicitamente.
  #   docker compose run --rm pipeline python pipeline/ingest.py
  pipeline:
    build: { context: ., dockerfile: pipeline/Dockerfile }
    volumes: ["./data:/app/data", "./out:/app/out"]
    environment:
      DATABASE_URL: postgresql://plomada:plomada@db:5432/plomada
    profiles: ["tools"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  pliego_datos:
