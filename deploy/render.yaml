# Blueprint de Render: cuatro servicios en un solo deploy (tres de Plomada,
# legado en legacy/plomada/, y la plataforma Pliego).
#
#   1. plomada-db     -- Postgres del warehouse (plan free)
#   2. plomada-api    -- API publica + MCP, contenedor Docker de api/
#   3. plomada-sitio  -- Static Site: plomada/build.py genera site/ y Render
#                        lo sirve. No hay servidor propio -- las fichas, el
#                        buscador y los municipios se hidratan en el navegador
#                        contra el API (services[].envVars.PLOMADA_API_URL).
#   4. pliego-app     -- La plataforma Pliego para empresas (plataforma/),
#                        contenedor Docker con DISCO persistente: ahi viven
#                        el warehouse DuckDB, la cache de Croma y los PDFs.
#                        Sin disco, cada deploy los borraria.
#
# Las reglas de `routes` del sitio son la traduccion de site/_redirects al
# formato de Render, y NO son opcionales: /contrato/<slug>/ y
# /municipio/<slug>/ no tienen un archivo detras. Sin ellas, toda ficha
# compartida da 404.
#
# Guias: legacy/plomada/docs/DESPLIEGUE_RENDER.md (sitio) y legacy/plomada/README.md (API).
# Este archivo vive en deploy/; Render lo busca en la raiz, asi que en el
# panel hay que apuntar el blueprint a deploy/render.yaml.

services:
  # --- API publica + MCP -------------------------------------------------
  - type: web
    name: plomada-api
    runtime: docker
    dockerfilePath: ./legacy/plomada/api/Dockerfile
    dockerContext: ./legacy/plomada
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plomada-db
          property: connectionString
      # OJO: debe ser el host REAL del servicio (el mismo que consume el
      # sitio en PLOMADA_API_URL, abajo). De aqui sale el allowlist de Host
      # del transporte MCP y la URL con la que Claude alcanza /mcp: con un
      # host equivocado, /mcp responde 421 a todo y /asistente/ muere.
      - key: SELF_URL
        value: https://plumb-duy6.onrender.com
      - key: CORS_ORIGINS
        sync: false

  # --- Sitio estatico ----------------------------------------------------
  - type: web
    runtime: static
    name: plomada-sitio
    branch: main
    buildCommand: pip install -r legacy/plomada/plomada/requirements.txt && python3 legacy/plomada/plomada/build.py
    staticPublishPath: ./legacy/plomada/plomada/site
    envVars:
      # El API que consulta el navegador. Cambiar aqui si se mueve el servicio.
      - key: PLOMADA_API_URL
        value: https://plumb-duy6.onrender.com
      # El build llama al API 60+ veces (sitemap de 12.678 fichas). Si el API
      # esta dormido, la primera respuesta tarda: el cliente ya reintenta con
      # backoff y un timeout de 60 s en la primera llamada.
      - key: PYTHON_VERSION
        value: "3.12"

    routes:
      # Rutas dinamicas -> su shell. `rewrite` conserva la URL en la barra
      # (a diferencia de `redirect`, que la cambiaria y romperia el enlace
      # compartido).
      - type: rewrite
        source: /contrato/*
        destination: /contrato/index.html
      - type: rewrite
        source: /municipio/*
        destination: /municipio/index.html
      # Estos dos estaban solo en vercel.json (canal cerrado): sin ellos las
      # fichas de entidad y proveedor compartidas dan 404.
      - type: rewrite
        source: /entidad/*
        destination: /entidad/index.html
      - type: rewrite
        source: /proveedor/*
        destination: /proveedor/index.html

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Los JSON del tablero se regeneran en cada build; el HTML tambien.
      # Cache corto para que un redespliegue se vea sin esperar.
      - path: /datos/*
        name: Cache-Control
        value: public, max-age=300
      # El bundle y Leaflet llevan hash o version fija: se pueden cachear.
      - path: /static/vendor/*
        name: Cache-Control
        value: public, max-age=86400

  # --- Plataforma Pliego (cuentas, perfil, datos por empresa) ----------------
  - type: web
    name: pliego-app
    runtime: docker
    dockerfilePath: ./plataforma/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Un solo worker: el warehouse DuckDB y la cola de trabajos viven en el
    # proceso (ver pliego/comun/warehouse.py). Escalar = pasar la cola a Postgres.
    numInstances: 1
    disk:
      name: pliego-datos
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plomada-db
          property: connectionString
      - key: PLATAFORMA_DATOS
        value: /app/data
      - key: PLIEGO_FUENTE
        value: warehouse
      # URL publica del servicio: va en los enlaces de los correos.
      - key: BASE_URL
        value: https://pliego-app.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_URL
        sync: false
      - key: CORREO_REMITENTE
        value: Pliego <no-responder@pliego.co>
      - key: PLATAFORMA_ADMINS
        sync: false
      - key: CROMA_API_KEY
        sync: false
      - key: CROMA_DESDE_ANIO
        value: "2024"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PORT
        value: "8100"

databases:
  - name: plomada-db
    databaseName: plomada
    user: plomada
    plan: free
